<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白模动捕 · 视频对照</title>
<style>
  :root { color-scheme: dark; background: #151719; color: #eee; font: 16px/1.55 system-ui, sans-serif; }
  body { max-width: 840px; margin: 0 auto; padding: 24px 16px 52px; }
  h1 { margin: 0 0 8px; font-size: 1.6rem; }
  h2 { margin: 0 0 12px; font-size: 1.15rem; }
  a { color: #9dcaff; }
  section { margin-top: 32px; }
  p { color: #c3c5c8; margin: 8px 0; }
  .views, .labels { display: grid; grid-template-columns: 1fr 1fr; }
  .labels { color: #c3c5c8; font-size: .85rem; margin-bottom: 5px; }
  .labels span:last-child { padding-left: 8px; }
  .panel { position: relative; overflow: hidden; aspect-ratio: 414 / var(--height); background: #33383e; }
  .panel video { display: block; width: 100%; height: 100%; }
  .reference video {
    position: absolute;
    width: calc(1920 / 414 * 100%);
    height: calc(1080 / var(--height) * 100%);
    left: calc(-1 * var(--x) / 414 * 100%);
    top: calc(-1 * var(--y) / var(--height) * 100%);
    object-fit: fill;
  }
  .controls { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .controls input { flex: 1; min-width: 0; accent-color: #9dcaff; }
  button { min-width: 4em; min-height: 36px; border: 1px solid #5d636c; border-radius: 6px; background: #282b30; color: inherit; }
  output { font: .85rem/1.4 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .status { color: #ffcf96; }
  .status:empty { display: none; }
</style>
<main>
  <h1>白模动捕 · 视频对照</h1>
  <a href="https://github.com/zkkkkkkkkk88/white-model-mocap">GitHub 仓库</a>

  <section id="duo" data-offset="2" style="--height: 742; --x: 206; --y: 58">
    <h2>双人舞蹈</h2>
    <div class="labels"><span>参考视频</span><span>白模 · v0.18</span></div>
    <div class="views">
      <div class="panel reference"><video muted playsinline preload="none" aria-label="双人参考视频" data-file="character-retargeting.mp4"></video></div>
      <div class="panel"><video muted playsinline preload="metadata" aria-label="双人白模" src="duo-mocap.mp4"></video></div>
    </div>
    <div class="controls"><button type="button">播放</button><input type="range" min="0" max="5" value="0" step="0.01" aria-label="双人进度"><output>0.0 / 5.0 秒</output></div>
    <p class="status" role="status"></p>
    <p>结果经过局部重检和两人交错时的纵深修正。<a href="https://github.com/toyxyz/toyxyz_RGBMocap/blob/237e1f3b51d4d2add4f3654f49259e0afc70522e/docs/samples/character-retargeting.mp4">原片出处</a></p>
  </section>

  <section id="solo" data-offset="6" style="--height: 736; --x: 222; --y: 60">
    <h2>单人舞蹈</h2>
    <div class="labels"><span>参考视频</span><span>白模 · v0.13</span></div>
    <div class="views">
      <div class="panel reference"><video muted playsinline preload="none" aria-label="单人参考视频" data-file="motion-capture.mp4"></video></div>
      <div class="panel"><video muted playsinline preload="metadata" aria-label="单人白模" src="solo-mocap.mp4"></video></div>
    </div>
    <div class="controls"><button type="button">播放</button><input type="range" min="0" max="5" value="0" step="0.01" aria-label="单人进度"><output>0.0 / 5.0 秒</output></div>
    <p class="status" role="status"></p>
    <p>约 3.1 秒的右膝朝向有待复核。<a href="https://github.com/toyxyz/toyxyz_RGBMocap/blob/237e1f3b51d4d2add4f3654f49259e0afc70522e/docs/samples/motion-capture.mp4">原片出处</a></p>
  </section>
  <noscript><p>启用 JavaScript 后可同步播放。也可在仓库下载白模视频和对照命令。</p></noscript>
</main>
<script type="module" src="compare.js"></script>
</html>
